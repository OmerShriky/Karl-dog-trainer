# Pages CMS: the editing screen for the site (https://app.pagescms.org)
# Every change Karl saves here is committed to GitHub, and Vercel updates the site within about a minute.
media:
  input: media
  output: /media

content:
  - name: site
    label: תוכן האתר
    type: file
    path: content.json
    format: json
    fields:
      - name: seo
        label: כותרות לגוגל
        description: הכותרת והתיאור שמופיעים בתוצאות החיפוש של גוגל ובלשונית הדפדפן
        type: object
        fields:
          - name: home
            label: עמוד ראשי
            type: object
            fields:
              - { name: title, label: כותרת, type: string }
              - { name: description, label: תיאור, type: text }
          - name: services
            label: עמוד השירותים
            type: object
            fields:
              - { name: title, label: כותרת, type: string }
              - { name: description, label: תיאור, type: text }
          - name: faq
            label: עמוד השאלות הנפוצות
            type: object
            fields:
              - { name: title, label: כותרת, type: string }
              - { name: description, label: תיאור, type: text }

      - name: brand
        label: פרטי העסק
        type: object
        fields:
          - { name: name, label: שם העסק, type: string }
          - { name: short, label: שם קצר, type: string }
          - { name: tagline, label: משפט מיתוג, type: string }
          - { name: phoneDisplay, label: טלפון כפי שמוצג באתר, type: string, description: "למשל 052-874-6848" }
          - { name: whatsapp, label: מספר וואטסאפ, type: string, description: "בפורמט בינלאומי בלי + ובלי מקפים, למשל 972528746848" }
          - { name: email, label: מייל, type: string }
          - { name: reservist, label: תגית מילואים, type: string }
          - { name: reservistText, label: משפט על המילואים, type: text, description: "מופיע בסוף הטקסט של 'קצת עליי'" }

      - name: nav
        label: תפריט
        description: אפשר לשנות רק את השם שמופיע בתפריט. לא לשנות את המזהה ואת הכתובת.
        type: object
        list: { min: 3, max: 3 }
        fields:
          - { name: id, label: מזהה (לא לשנות), type: string }
          - { name: label, label: שם בתפריט, type: string }
          - { name: href, label: כתובת (לא לשנות), type: string }

      - name: home
        label: עמוד ראשי
        type: object
        fields:
          - { name: eyebrow, label: שורה קטנה מעל הכותרת, type: string }
          - { name: heroTitle, label: כותרת ראשית, type: string }
          - { name: heroText, label: טקסט מתחת לכותרת, type: text }
          - { name: heroImage, label: תמונה ראשית, type: image }
          - { name: heroImageAlt, label: תיאור התמונה הראשית, type: string, description: "משפט קצר שמתאר מה רואים בתמונה (לנגישות ולגוגל)" }
          - { name: ctaPrimary, label: כפתור וואטסאפ, type: string }
          - { name: ctaSecondary, label: כפתור לשירותים, type: string }
          - { name: aboutTitle, label: "כותרת 'קצת עליי'", type: string }
          - { name: about, label: "פסקאות 'קצת עליי'", type: text, list: true }
          - { name: aboutImage, label: "תמונה ב'קצת עליי'", type: image }
          - { name: aboutImageAlt, label: "תיאור התמונה ב'קצת עליי'", type: string }
          - name: highlights
            label: שלוש הקוביות מתחת ל'קצת עליי'
            type: object
            list: { min: 3, max: 3 }
            fields:
              - { name: title, label: כותרת, type: string }
              - { name: text, label: טקסט, type: text }
          - { name: galleryTitle, label: "כותרת הגלריה ('מהשטח')", type: string }
          - name: gallery
            label: "גלריה: תמונות וסרטונים"
            description: "אפשר להוסיף, למחוק ולגרור כדי לשנות את הסדר"
            type: object
            list: true
            fields:
              - name: type
                label: סוג
                type: select
                options:
                  values:
                    - { name: image, label: תמונה }
                    - { name: video, label: סרטון }
              - { name: src, label: "קובץ (תמונה או סרטון mp4)", type: file, options: { categories: [image, video] } }
              - { name: poster, label: "תמונת כיסוי לסרטון (רק לסרטון)", type: image }
              - { name: alt, label: תיאור קצר, type: string, description: "מה רואים בתמונה או בסרטון" }
          - name: servicesCta
            label: הכרטיס שמוביל לשירותים (אחרי הביקורות)
            type: object
            fields:
              - { name: title, label: כותרת, type: string }
              - { name: text, label: טקסט, type: text }
              - { name: button, label: כפתור, type: string }
          - { name: followTitle, label: "כותרת 'בואו לעקוב'", type: string }

      - name: services
        label: עמוד השירותים
        type: object
        fields:
          - { name: kicker, label: שורה קטנה מעל הכותרת, type: string }
          - { name: title, label: כותרת, type: string }
          - { name: intro, label: טקסט פתיחה, type: text }
          - name: items
            label: שירותים
            description: "אפשר להוסיף, למחוק ולגרור כדי לשנות את הסדר"
            type: object
            list: true
            fields:
              - { name: id, label: "מזהה באנגלית (אותיות קטנות, בלי רווחים)", type: string }
              - { name: title, label: שם השירות, type: string }
              - { name: short, label: תיאור קצר, type: string }
              - { name: where, label: "איפה (תגיות, למשל 'בבית הלקוח')", type: string, list: true }
              - { name: body, label: הסבר מלא, type: text }
              - { name: includes, label: מה כולל, type: string, list: true }
          - { name: cardCtaText, label: טקסט בתחתית כל שירות, type: string }
          - { name: cardCtaButton, label: כפתור בתחתית כל שירות, type: string }
          - { name: ctaTitle, label: כותרת הכרטיס בסוף העמוד, type: string }
          - { name: ctaButton, label: כפתור הכרטיס בסוף העמוד, type: string }
          - { name: ctaMessage, label: הודעת הוואטסאפ המוכנה, type: text }

      - name: faq
        label: שאלות נפוצות
        type: object
        fields:
          - { name: kicker, label: שורה קטנה מעל הכותרת, type: string }
          - { name: title, label: כותרת, type: string }
          - { name: intro, label: טקסט פתיחה, type: text }
          - name: items
            label: שאלות ותשובות
            description: "אפשר להוסיף, למחוק ולגרור כדי לשנות את הסדר"
            type: object
            list: true
            fields:
              - { name: q, label: שאלה, type: string }
              - { name: a, label: תשובה, type: text }
          - { name: askTitle, label: "כותרת 'לא מצאתם?'", type: string }
          - { name: askText, label: "טקסט 'לא מצאתם?'", type: string }
          - { name: askButton, label: "כפתור 'לא מצאתם?'", type: string }

      - name: reviews
        label: ביקורות מגוגל
        type: object
        fields:
          - { name: title, label: כותרת, type: string }
          - { name: rating, label: "הדירוג בגוגל (למשל 5.0)", type: string }
          - { name: link, label: קישור לביקורות בגוגל, type: string }
          - name: items
            label: ביקורות
            type: object
            list: true
            fields:
              - { name: name, label: שם הכותב, type: string }
              - { name: date, label: תאריך הביקורת, type: date, options: { format: yyyy-MM-dd }, description: "האתר מציג לבד כמה זמן עבר, למשל 'לפני חודשיים'" }
              - { name: stars, label: "כוכבים (1 עד 5)", type: number }
              - { name: text, label: הביקורת, type: text }

      - name: links
        label: קישורים (רשתות חברתיות ועוד)
        description: "המזהה קובע איזה סמל יוצג: whatsapp, email, instagram, facebook, easy, uniform. לא לשנות אותו."
        type: object
        list: true
        fields:
          - { name: id, label: מזהה (לא לשנות), type: string }
          - { name: label, label: שם, type: string }
          - { name: detail, label: טקסט קטן, type: string }
          - { name: url, label: קישור, type: string }

      - name: contact
        label: טופס יצירת קשר
        type: object
        fields:
          - { name: title, label: כותרת, type: string }
          - { name: text, label: טקסט, type: text }
          - { name: nameLabel, label: שדה שם, type: string }
          - { name: phoneLabel, label: שדה טלפון, type: string }
          - { name: messageLabel, label: שדה הודעה, type: string }
          - { name: submit, label: כפתור שליחה, type: string }
          - { name: sending, label: הודעה בזמן שליחה, type: string }
          - { name: success, label: הודעה אחרי שליחה, type: string }
          - { name: error, label: הודעה אם השליחה נכשלה, type: string }
          - { name: sheetsUrl, label: "כתובת הגיליון ב-Google Sheets (לא לשנות)", type: string }
          - { name: web3formsKey, label: "מפתח Web3Forms (לא לשנות)", type: string }

      - name: footer
        label: תחתית העמוד
        type: object
        fields:
          - { name: copyright, label: שורת זכויות יוצרים, type: string }
